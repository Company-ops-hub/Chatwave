<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renew Broadcast</title>
<style>
:root{--pri:#0f766e;--pri-ink:#fff;--bg:#f4f6f8;--card:#fff;--ink:#17212b;--mut:#64748b;--line:#e2e8f0;--ok:#067647;--okbg:#e4f5ec;--warn:#9a5b00;--warnbg:#fff1d6;--err:#b42318;--errbg:#fde8e6;--info:#1d4ed8;--infobg:#e6eeff;--sb:#fff;--bub:#dcf8c6;--chat:#efeae2;--sh:0 1px 2px rgba(15,23,42,.06)}
[data-theme=dark]{--bg:#0d1218;--card:#151c25;--ink:#e6ecf2;--mut:#93a1b3;--line:#263241;--ok:#5fd394;--okbg:#10301f;--warn:#f2b45a;--warnbg:#38280e;--err:#f4908a;--errbg:#3a1613;--info:#8db3ff;--infobg:#15284d;--sb:#111820;--bub:#144d37;--chat:#0f1a17;--sh:none}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}p{margin:0 0 10px}
.mut{color:var(--mut)}.sm{font-size:12px}.sp{flex:1}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.end{justify-content:flex-end}.mt{margin-top:16px}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--pri)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}.btn.dng{background:var(--err);color:#fff;border-color:var(--err)}
.btn.ghost{border-color:transparent;background:transparent}.btn.xs{padding:3px 9px;font-size:12px}
label{display:block;font-weight:500;margin:10px 0 4px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
input[type=checkbox],input[type=radio]{width:auto;margin-right:6px}
.chk{display:flex;align-items:center;font-weight:400;margin:6px 0;cursor:pointer}
.err{color:var(--err);font-size:12px;margin-top:4px}
.app{display:flex;min-height:100vh}
.sb{width:230px;background:var(--sb);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;padding:14px 10px;flex-shrink:0}
.sb a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;margin-bottom:2px}
.sb a:hover{background:var(--bg)}.sb a.on{background:var(--pri);color:var(--pri-ink)}
.sb a.off{opacity:.55}
.main{flex:1;min-width:0}
.top{height:56px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:5}
.logo{width:30px;height:30px;border-radius:8px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font-weight:700;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}
.badge{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--warnbg);color:var(--warn)}
.um{position:relative}.umm{position:absolute;right:0;top:38px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;min-width:150px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.umm button{display:block;width:100%;text-align:left}
.content{padding:24px;max-width:1280px;margin:0 auto}
.head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--sh);margin-bottom:16px}
.grid{display:grid;gap:14px}.g6{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kpi{padding:14px 16px}.kpi b{display:block;font-size:24px;line-height:1.2}.kpi span{color:var(--mut);font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg);color:var(--mut);white-space:nowrap}
.c-ok{background:var(--okbg);color:var(--ok)}.c-warn{background:var(--warnbg);color:var(--warn)}.c-err{background:var(--errbg);color:var(--err)}.c-info{background:var(--infobg);color:var(--info)}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--pri)}
.pager{display:flex;justify-content:space-between;align-items:center;padding-top:12px;color:var(--mut)}
.alert{padding:10px 14px;border-radius:8px;margin-bottom:8px;background:var(--infobg);color:var(--info)}.alert.warning{background:var(--warnbg);color:var(--warn)}.alert.error{background:var(--errbg);color:var(--err)}
.sk{height:16px;border-radius:6px;background:linear-gradient(90deg,var(--line),var(--bg),var(--line));background-size:200% 100%;animation:sk 1.2s infinite;margin:10px 0}
@keyframes sk{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){.sk{animation:none}}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(10,15,25,.55);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--card);border-radius:14px;padding:22px;width:min(460px,100%);max-height:90vh;overflow:auto}.dlg.wide{width:min(860px,100%)}
#toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;max-width:340px;box-shadow:0 6px 20px rgba(0,0,0,.25)}.toast.error{background:var(--err);color:#fff}.toast.ok{background:var(--ok);color:#fff}
.steps{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.steps span{padding:6px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut)}.steps span.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}.steps span.done{color:var(--ok)}
.tpl{border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--card)}.tpl.sel{border-color:var(--pri)}.tpl.dis{opacity:.5;cursor:not-allowed}
.chat{background:var(--chat);border-radius:10px;padding:14px}
.bub{background:var(--bub);border-radius:4px 12px 12px 12px;padding:8px 10px;max-width:290px;font-size:13px;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.bub mark{background:transparent;color:inherit;font-weight:600;text-decoration:underline dotted}.bub .ft{color:var(--mut);font-size:11px;margin-top:6px}
.bh{width:100%;border-radius:8px;margin-bottom:6px;display:block;max-height:160px;object-fit:cover}.bh.ph{background:var(--line);color:var(--mut);padding:30px 0;text-align:center;font-size:12px}
.bb{background:var(--card);color:var(--info);text-align:center;border-radius:8px;padding:6px;margin-top:4px;font-size:13px;max-width:290px}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}.login .card{width:min(400px,100%);padding:28px}
.dim{opacity:.5;pointer-events:none}.ribbon{position:relative}
.ribbon .ov2{position:absolute;inset:0;display:grid;place-items:center;z-index:2}.ribbon .ov2 div{background:var(--card);border:1px solid var(--line);padding:14px 22px;border-radius:12px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.mb{display:none}
@media(max-width:900px){.sb{position:fixed;left:-250px;z-index:40;transition:left .2s;box-shadow:0 0 24px rgba(0,0,0,.2)}.sb.open{left:0}.mb{display:inline-block}.content{padding:14px}}
canvas{max-height:280px}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div><div id="toasts" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
/* ===== CONFIG: change branding and switch features here, no layout edits needed ===== */
const BRAND={brandName:'Renew',logoUrl:'',primaryColor:'#0f766e',supportEmail:'support@renew.example'};
const FEATURES={automations:false,inbox:false,integrations:false};
const API_URL=''; // optional: paste the Apps Script web app URL here, or enter it on the login screen
/* ===================================================================================== */
const TZ='Europe/Dublin';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fdt=s=>{if(!s)return'—';const d=new Date(s);return isNaN(d)?'—':new Intl.DateTimeFormat('en-IE',{timeZone:TZ,dateStyle:'medium',timeStyle:'short'}).format(d)};
const fnum=n=>new Intl.NumberFormat('en-IE').format(Number(n)||0);
const feur=n=>new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format(Number(n)||0);
const uid=()=>'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const lsGet=k=>{try{return localStorage.getItem(k)||''}catch(e){return''}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const ssGet=k=>{try{return sessionStorage.getItem(k)||''}catch(e){return''}};
const ssSet=(k,v)=>{try{v?sessionStorage.setItem(k,v):sessionStorage.removeItem(k)}catch(e){}};
const S={token:ssGet('rn_tok'),demo:false};
let main,timer=null,chart=null;
const getUrl=()=>API_URL||lsGet('rn_url');
const mkErr=(m,c)=>{const e=new Error(m);e.code=c;return e};

async function api(action,payload){
  const url=getUrl();if(!url)throw mkErr('Enter the web app URL first.','NOURL');
  let r,j;
  try{r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:S.token,payload:payload||{}}),redirect:'follow'})}
  catch(e){throw mkErr('Cannot reach the server. Check your connection and the web app URL.','NET')}
  try{j=await r.json()}catch(e){throw mkErr('Unexpected response. Check the web app is deployed with access "Anyone".','BAD')}
  if(!j.ok){if(j.code==='AUTH'&&action!=='login')doLogout(true);throw mkErr(j.error||'Error',j.code)}
  return j.data;
}
function toast(m,t){const d=document.createElement('div');d.className='toast '+(t||'');d.textContent=m;$('#toasts').append(d);setTimeout(()=>d.remove(),t==='error'?6000:3500)}
function openModal(html,wide){closeModal();const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="dlg'+(wide?' wide':'')+'" role="dialog" aria-modal="true">'+html+'</div>';o.addEventListener('mousedown',e=>{if(e.target===o)closeModal()});$('#modal').append(o);const f=o.querySelector('input:not([type=checkbox]),select,textarea');if(f)f.focus();return o.firstElementChild}
function closeModal(){$('#modal').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
/* body must be trusted HTML: escape dynamic values with esc() before passing */
function confirmDlg(o){return new Promise(res=>{
  const d=openModal('<h3>'+esc(o.title)+'</h3><p class="mut">'+(o.body||'')+'</p>'+(o.typed?'<label for="cf">Type <b>'+esc(o.typed)+'</b> to confirm</label><input id="cf" autocomplete="off">':'')+'<div class="row end mt"><button class="btn" id="cn">Cancel</button><button class="btn '+(o.danger?'dng':'pri')+'" id="co"'+(o.typed?' disabled':'')+'>'+esc(o.ok||'Confirm')+'</button></div>');
  if(o.typed)$('#cf',d).oninput=e=>{$('#co',d).disabled=e.target.value!==o.typed};
  $('#cn',d).onclick=()=>{closeModal();res(false)};$('#co',d).onclick=()=>{closeModal();res(true)};
  $('#modal').firstElementChild.addEventListener('mousedown',e=>{if(e.target.classList.contains('ov'))res(false)});
})}
const skel=n=>Array.from({length:n||4},()=>'<div class="sk"></div>').join('');
const CH={Draft:'',Scheduled:'c-info',Sending:'c-info',Paused:'c-warn',Completed:'c-ok',Failed:'c-err',Cancelled:'',APPROVED:'c-ok',PENDING:'c-warn',REJECTED:'c-err',PAUSED:'c-warn','OPT-OUT':'c-err',YES:'c-ok',NO:''};
const chip=s=>'<span class="chip '+(CH[s]||'')+'">'+esc(s||'—')+'</span>';
const empty=(t,s)=>'<div class="empty"><h3>'+esc(t)+'</h3><p>'+esc(s||'')+'</p></div>';
const pager=r=>'<div class="pager"><span>'+fnum(r.total)+' total</span><span class="row"><button class="btn xs" data-pg="'+(r.page-1)+'"'+(r.page<=1?' disabled':'')+'>Previous</button>Page '+r.page+' of '+r.pages+'<button class="btn xs" data-pg="'+(r.page+1)+'"'+(r.page>=r.pages?' disabled':'')+'>Next</button></span></div>';
const bindPager=(root,cb)=>root.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>cb(+b.dataset.pg));
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const btnBusy=async(b,fn)=>{b.disabled=true;try{return await fn()}finally{b.disabled=false}};

/* Dublin wall-clock string "YYYY-MM-DDTHH:mm" -> UTC ISO */
function tzOff(ts){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date(ts)).map(x=>[x.type,x.value]));return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-ts}
function dublinToISO(v){const[d,t]=v.split('T'),[y,m,da]=d.split('-').map(Number),[hh,mm]=t.split(':').map(Number);const base=Date.UTC(y,m-1,da,hh,mm);let u=base;for(let i=0;i<2;i++)u=base-tzOff(u);return new Date(u).toISOString()}

/* ---------- theme / branding ---------- */
function applyTheme(t){document.documentElement.dataset.theme=t;lsSet('rn_theme',t)}
applyTheme(lsGet('rn_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
document.documentElement.style.setProperty('--pri',BRAND.primaryColor);
document.title=BRAND.brandName+' Broadcast';
const logoHtml=()=>'<span class="logo">'+(/^https:\/\//.test(BRAND.logoUrl)?'<img src="'+esc(BRAND.logoUrl)+'" alt="">':esc(BRAND.brandName.charAt(0)))+'</span>';

/* ---------- auth ---------- */
function loginView(msg){
  $('#app').innerHTML='<div class="login"><form class="card" id="lf"><div class="row" style="margin-bottom:14px">'+logoHtml()+'<h1>'+esc(BRAND.brandName)+'</h1></div><p class="mut">Sign in to manage WhatsApp campaigns.</p>'+
  (API_URL?'':'<label for="lu">Web app URL</label><input id="lu" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(lsGet('rn_url'))+'">')+
  '<label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required><div class="err" id="le" role="alert">'+esc(msg||'')+'</div><button class="btn pri" style="width:100%;margin-top:14px" id="lb">Sign in</button><p class="mut sm mt">Need help? <a href="mailto:'+esc(BRAND.supportEmail)+'">'+esc(BRAND.supportEmail)+'</a></p></form></div>';
  $('#lf').onsubmit=async e=>{e.preventDefault();const b=$('#lb');
    if(!API_URL){const u=$('#lu').value.trim();if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)){$('#le').textContent='Enter a valid Apps Script web app URL (https://script.google.com/…/exec).';return}lsSet('rn_url',u)}
    b.disabled=true;b.textContent='Signing in…';$('#le').textContent='';
    try{const d=await api('login',{password:$('#lp').value});S.token=d.token;ssSet('rn_tok',d.token);boot()}
    catch(er){$('#le').textContent=er.message;b.disabled=false;b.textContent='Sign in';$('#lp').value=''}};
}
function doLogout(expired){if(!expired&&S.token)api('logout').catch(()=>{});S.token='';ssSet('rn_tok','');stopTimer();closeModal();loginView(expired?'Your session has expired. Please sign in again.':'')}

/* ---------- shell + router ---------- */
const NAV=[['dashboard','Dashboard','▦'],['campaigns','Campaigns','✉'],['contacts','Contacts','☺'],['templates','Templates','❏'],['replies','Replies','↩'],['optouts','Opt-outs','⊘'],['automations','Automations','⚡'],['inbox','Inbox','✎','inbox'],['integrations','Integrations','⇄','integrations'],['settings','Settings','⚙'],['activity','Activity log','☰']];
function shell(){
  $('#app').innerHTML='<div class="app"><aside class="sb" id="sb"><nav aria-label="Main">'+NAV.filter(n=>!n[3]||FEATURES[n[3]]).map(n=>'<a href="#'+n[0]+'" data-n="'+n[0]+'"><span aria-hidden="true">'+n[2]+'</span>'+n[1]+(n[0]==='automations'&&!FEATURES.automations?' <span class="chip sm" style="margin-left:auto">Soon</span>':'')+'</a>').join('')+'</nav></aside>'+
  '<div class="main"><header class="top"><button class="btn ghost mb" id="bg" aria-label="Open menu">☰</button>'+logoHtml()+'<b>'+esc(BRAND.brandName)+'</b><span class="badge" id="db" hidden>DEMO</span><span class="sp"></span><button class="btn ghost" id="th" aria-label="Toggle dark mode">◐</button><div class="um"><button class="btn" id="ub" aria-haspopup="true">Admin ▾</button><div class="umm" id="um" hidden><button class="btn ghost" id="lo">Log out</button></div></div></header><main class="content" id="main"></main></div></div>';
  main=$('#main');
  $('#bg').onclick=()=>$('#sb').classList.toggle('open');
  $('#th').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
  $('#ub').onclick=()=>{$('#um').hidden=!$('#um').hidden};$('#lo').onclick=()=>doLogout(false);
  $('#sb').onclick=e=>{if(e.target.closest('a'))$('#sb').classList.remove('open')};
}
function setDemo(v){S.demo=!!v;const b=$('#db');if(b)b.hidden=!S.demo}
function stopTimer(){if(timer){clearInterval(timer);timer=null}if(chart){chart.destroy();chart=null}}
async function boot(){shell();window.onhashchange=render;try{const s=await api('getSettings');setDemo(s.settings.demo_mode)}catch(e){if(e.code==='AUTH')return}render()}
async function render(){
  stopTimer();const id=(location.hash||'#dashboard').slice(1).split('?')[0];const pg=PAGES[id]||PAGES.dashboard;
  document.querySelectorAll('.sb a').forEach(a=>a.classList.toggle('on',a.dataset.n===id));
  main.innerHTML=skel(5);
  try{await pg()}catch(e){if(e.code==='AUTH')return;main.innerHTML='<div class="card empty"><h3>Something went wrong</h3><p>'+esc(e.message)+'</p><button class="btn pri" id="rt">Try again</button></div>';$('#rt').onclick=render}
}
const head=(t,right)=>'<div class="head"><h1>'+esc(t)+'</h1><span class="sp"></span>'+(right||'')+'</div>';

/* ---------- WhatsApp-style preview ---------- */
function bubble(t,vals,hdr){
  const c=t.components||[],H=c.find(x=>x.type==='HEADER'),B=c.find(x=>x.type==='BODY'),F=c.find(x=>x.type==='FOOTER'),BT=c.find(x=>x.type==='BUTTONS');
  let h='';
  if(H&&H.format==='IMAGE')h+=/^https:\/\//i.test(hdr||'')?'<img class="bh" src="'+esc(hdr)+'" alt="" referrerpolicy="no-referrer">':'<div class="bh ph">Image header</div>';
  else if(H&&H.text)h+='<b>'+esc(H.text)+'</b><br>';
  const body=esc(B?B.text:'').replace(/\{\{(\d+)\}\}/g,(m,n)=>'<mark>'+esc(vals&&vals[n-1]?vals[n-1]:'{{'+n+'}}')+'</mark>');
  return '<div class="chat"><div class="bub">'+h+body+(F&&F.text?'<div class="ft">'+esc(F.text)+'</div>':'')+'</div>'+((BT&&BT.buttons)||[]).map(b=>'<div class="bb">'+(b.type==='URL'?'↗ ':'')+esc(b.text)+'</div>').join('')+'</div>';
}

/* ================= PAGES ================= */
const PAGES={};

/* ---- Dashboard ---- */
PAGES.dashboard=async()=>{
  const d=await api('getDashboardStats');setDemo(d.demo_mode);const k=d.kpis;
  const cards=[['Sent today',fnum(k.sent_today)+' / '+fnum(d.daily_limit)],['Delivered',fnum(k.delivered)],['Read',fnum(k.read)],['Failed',fnum(k.failed)],['Replies',fnum(k.replies)],['Opt-outs',fnum(k.optouts)]];
  const pct=Math.min(100,Math.round(d.limit_used/Math.max(d.daily_limit,1)*100));
  main.innerHTML=head('Dashboard','<a class="btn pri" href="#new">New campaign</a>')+
  d.warnings.map(w=>'<div class="alert '+esc(w.level)+'" role="status">'+esc(w.text)+'</div>').join('')+
  '<div class="grid g6">'+cards.map(c=>'<div class="card kpi"><span>'+c[0]+'</span><b>'+c[1]+'</b></div>').join('')+'</div>'+
  '<div class="card"><div class="row"><b>Daily recipient limit</b><span class="sp"></span><span class="mut">'+fnum(d.limit_used)+' of '+fnum(d.daily_limit)+' unique recipients in the last 24 hours</span></div><div class="bar" style="margin-top:8px"><i style="width:'+pct+'%"></i></div>'+(d.quality?'<p class="mut sm mt">Number quality: '+chip(d.quality.rating)+' '+esc(d.quality.tier)+'</p>':'')+'</div>'+
  '<div class="card"><h2>Delivery funnel, last 7 days</h2><canvas id="ch" aria-label="Delivery funnel chart" role="img"></canvas></div>'+

const IFIELDS=[['phone','Phone *',['phone','mobile','phonenumber','whatsapp','number']],['first_name','First name',['firstname','first','name']],['last_name','Last name',['lastname','surname']],['email','Email',['email']],['custom1','Custom 1',['custom1']],['custom2','Custom 2',['custom2']],['custom3','Custom 3',['custom3']],['tags','Tags',['tags','tag']],['opted_in','Opted in (YES/NO)',['optedin','optin']],['consent_source','Consent source *',['consentsource','source']],['consent_date','Consent date *',['consentdate','date']]];
function importWizard(done){
  const IM={rows:[],hdr:[],map:{},fx:{},upd:false};

  const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
  const s1=()=>{d.innerHTML='<h3>Import contacts</h3><p class="mut">Upload a CSV or paste rows (with a header line). Consent source and consent date are required for every contact.</p><label for="if">CSV file</label><input id="if" type="file" accept=".csv,text/csv"><label for="ip">…or paste CSV text</label><textarea id="ip" rows="6" placeholder="phone,first_name,consent_source,consent_date"></textarea><div class="err" id="ie"></div><div class="row end mt"><button class="btn" id="i0">Cancel</button><button class="btn pri" id="i1">Continue</button></div>';
    $('#i0',d).onclick=closeModal;
    $('#i1',d).onclick=()=>{const f=$('#if',d).files[0],txt=$('#ip',d).value.trim();if(!f&&!txt){$('#ie',d).textContent='Choose a file or paste some rows.';return}
      Papa.parse(f||txt,{header:true,skipEmptyLines:true,complete:r=>{IM.rows=r.data;IM.hdr=r.meta.fields||[];if(!IM.rows.length){$('#ie',d).textContent='No rows found. Make sure the first line is a header.';return}
        IFIELDS.forEach(x=>{const h=IM.hdr.find(h=>x[2].includes(norm(h)));IM.map[x[0]]=h||''});if(IM.map.first_name&&IM.map.first_name===IM.map.phone)IM.map.first_name='';s2()},error:e=>{$('#ie',d).textContent='Could not read the file: '+e.message}})}};

    document.querySelectorAll('[data-f]',d).forEach(s=>s.onchange=()=>{IM.map[s.dataset.f]=s.value;IM.upd=$('#iu',d).checked;s2()});
    document.querySelectorAll('[data-fx]',d).forEach(i=>i.oninput=()=>IM.fx[i.dataset.fx]=i.value);
    $('#i0',d).onclick=s1;
    $('#i1',d).onclick=async e=>{IM.upd=$('#iu',d).checked;if(!IM.map.phone){$('#ie',d).textContent='Match the phone column.';return}
      for(const f of['consent_source','consent_date'])if(!IM.map[f]&&!IM.fx[f]){$('#ie',d).textContent='Provide '+f.replace('_',' ')+' (a column or one value for all rows).';return}
      try{IM.rep=await btnBusy(e.target,()=>api('importContacts',{rows:build(),dry_run:true,update_existing:IM.upd}));s3()}catch(er){$('#ie',d).textContent=er.message}}};
  const build=()=>IM.rows.map(r=>{const o={};IFIELDS.forEach(x=>{const f=x[0];o[f]=IM.map[f]?(r[IM.map[f]]==null?'':r[IM.map[f]]):(IM.fx[f]||'')});return o});
  const tbl=(t,l)=>l.length?'<h3 class="mt">'+t+' ('+fnum(l.length)+(l.length>=200?'+':'')+')</h3><div class="tw" style="max-height:160px;overflow:auto"><table><thead><tr><th>Row</th><th>Number</th><th>Reason</th></tr></thead><tbody>'+l.map(x=>'<tr><td>'+x.row+'</td><td>'+esc(x.phone)+'</td><td>'+esc(x.reason)+'</td></tr>').join('')+'</tbody></table></div>':'';
  const s3=()=>{const r=IM.rep,ok=r.new_count+r.update_count;d.innerHTML='<h3>Validation report</h3><div class="grid g6"><div class="card kpi"><span>Rows</span><b>'+fnum(r.total)+'</b></div><div class="card kpi"><span>New</span><b style="color:var(--ok)">'+fnum(r.new_count)+'</b></div><div class="card kpi"><span>Updates</span><b>'+fnum(r.update_count)+'</b></div><div class="card kpi"><span>Invalid</span><b>'+fnum(r.invalid_count)+'</b></div><div class="card kpi"><span>Duplicates</span><b>'+fnum(r.duplicates_count)+'</b></div><div class="card kpi"><span>Opted-out</span><b>'+fnum(r.suppressed_count)+'</b></div></div>'+tbl('Invalid',r.invalid)+tbl('Duplicates',r.duplicates)+tbl('Suppressed (opted out)',r.suppressed)+'<div class="err" id="ie"></div><div class="row end mt"><button class="btn" id="i0">Back</button><button class="btn pri" id="i1"'+(ok?'':' disabled')+'>Import '+fnum(ok)+' contacts</button></div>';
    $('#i0',d).onclick=s2;$('#i1',d).onclick=async e=>{try{const f=await btnBusy(e.target,()=>api('importContacts',{rows:build(),dry_run:false,update_existing:IM.upd}));closeModal();toast('Imported '+f.new_count+' new, updated '+f.update_count+', skipped '+(f.invalid_count+f.duplicates_count+f.suppressed_count),'ok');done()}catch(er){$('#ie',d).textContent=er.message}}};
  s1();
}

  $('#sm').onclick=()=>{const m=openModal('<h3>Send test message</h3><label for="t1">Phone number</label><input id="t1" placeholder="+353…"><label for="t2">Template name</label><input id="t2" value="hello_world"><label for="t3">Language code</label><input id="t3" value="en_US"><label for="t4">Variables (comma separated, optional)</label><input id="t4"><div class="err" id="te" role="alert"></div><div class="row end mt"><button class="btn" id="t5">Cancel</button><button class="btn pri" id="t6">Send</button></div>');
    $('#t5',m).onclick=closeModal;$('#t6',m).onclick=async e=>{try{const r=await btnBusy(e.target,()=>api('sendTestMessage',{phone:$('#t1',m).value,template_name:$('#t2',m).value,language:$('#t3',m).value,variables:$('#t4',m).value.split(',').map(x=>x.trim()).filter(Boolean)}));closeModal();toast(r.message,'ok')}catch(er){$('#te',m).textContent=er.message}}};
  $('#s_pw').onclick=()=>{const m=openModal('<h3>Change password</h3><form id="pf"><label for="p1">Current password</label><input id="p1" type="password" autocomplete="current-password" required><label for="p2">New password (min. 12 characters)</label><input id="p2" type="password" autocomplete="new-password" minlength="12" required><label for="p3">Repeat new password</label><input id="p3" type="password" autocomplete="new-password" required><div class="err" id="pe" role="alert"></div><div class="row end mt"><button type="button" class="btn" id="p4">Cancel</button><button class="btn pri">Change password</button></div></form>');
    $('#p4',m).onclick=closeModal;$('#pf',m).onsubmit=async e=>{e.preventDefault();if($('#p2',m).value!==$('#p3',m).value){$('#pe',m).textContent='The new passwords do not match.';return}
      try{const r=await api('changePassword',{current_password:$('#p1',m).value,new_password:$('#p2',m).value});S.token=r.token;ssSet('rn_tok',r.token);closeModal();toast('Password changed. Other sessions were signed out.','ok')}catch(er){$('#pe',m).textContent=er.message}}};
};

/* ---- Activity log ---- */
PAGES.activity=async()=>{
  let q={page:1,page_size:50,search:''};
  main.innerHTML=head('Activity log')+'<div class="card"><input id="as" placeholder="Search activity" aria-label="Search activity" style="max-width:280px;margin-bottom:12px"><div id="al"></div></div>';
  const load=async()=>{$('#al').innerHTML=skel(6);const r=await api('listAuditLog',q);
    $('#al').innerHTML=r.items.length?'<div class="tw"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Details</th></tr></thead><tbody>'+r.items.map(x=>'<tr><td>'+fdt(x.ts)+'</td><td>'+esc(x.actor)+'</td><td>'+chip(x.action)+'</td><td style="word-break:break-word">'+esc(x.details)+'</td></tr>').join('')+'</tbody></table></div>'+pager(r):empty('No activity yet');
    bindPager($('#al'),p=>{q.page=p;load()})};
  $('#as').oninput=debounce(e=>{q.search=e.target.value;q.page=1;load()},300);
  await load();
};

/* ---------- start ---------- */
if(S.token&&getUrl())boot();else loginView('');
</script>
